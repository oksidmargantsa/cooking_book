x-backend: &backend
  image: python:3.12-slim
  working_dir: /srv/backend
  env_file: ./backend/.env
  volumes:
    - ./backend:/srv/backend:ro

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-recipes-dev}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-recipes-dev-password}"
    volumes:
      - minio-data:/data

  migrate:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - pip install -r requirements.txt && alembic upgrade head && exec python -m app.cli seed-ingredients

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-ec", "pip install -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  minio-data:
