name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://recipes:recipes@127.0.0.1:5432/recipes
      TEST_DATABASE_URL: postgresql+asyncpg://recipes:recipes@127.0.0.1:5432/recipes
      JWT_SECRET: test-secret-only-for-ci-validation
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recipes
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipes -d recipes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m alembic upgrade head
      - run: python -m app.cli seed-ingredients
      - run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
